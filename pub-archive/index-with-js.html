      .driver {

      .driver::after {
        border-left: 9px solid transparent;

        border-top: 9px solid #FFFFFF;
        content: "";
        height: 0;
        left: 50%;

        width: 0;
        z-index: 1;

        margin-top: 5px;

        flex-direction: row;

        box-shadow: 10px 10px 5px rgba(0, 0, 0, 0.2);
        height: 80px;
        padding: 8px 15px;
        width: auto;
      }

      .driver.highlight::after {

      }

      .driver.highlight .details {

      .driver.highlight .icon svg {

      }

        color: #03A9F4;
      }

      .driver .size {

      * Car icon colors.

      function getAllNodes() {

        const nodeCollection = collection(firestore, "users");
        const q = query(nodeCollection, where("isOnline", "==", true));
        const unsubscribe = onSnapshot(q, (snapshot) => {
          // const bounds = mMap.getBounds();

          snapshot.docChanges().forEach((change) => {
            const nodeId = change.doc.id;
            const doc = change.doc;
            console.log(change.doc.data());

            if (change.type === "added") {

              if (doc.data().latitude && doc.data().longitude) {
                let position = { lat: doc.data().latitude, lng: doc.data().longitude };


                let marker = new AdvancedMarkerElement({
                  map: map,
                  gmpClickable: true,

                  gmpDraggable: false,
                  position: position,
                  title: nodeId,
                  // content: pinTextGlyph.element,
                });

                MARKERS.set(nodeId, marker);
            
              }

            }
            if (change.type === "modified") {

              if (doc.data().latitude && doc.data().longitude) {
                let position = { lat: doc.data().latitude, lng: doc.data().longitude };
                let marker = MARKERS.get(nodeId);
                marker.position = position;
              }

            }
            if (change.type === "removed") {

              let marker = MARKERS.get(nodeId);
              marker.setMap(null); 
              MARKERS.delete(nodeId);

              
            }
          });
        });
      }

      function getQueryParameters(url) {
          // Create a temporary anchor element to parse the URL
          var anchor = document.createElement('a');
          anchor.href = url;

          // Split the query string by '&' and then by '=' to get key-value pairs
          var params = {};
          anchor.search.slice(1).split('&').forEach(function(part) {
              var item = part.split('=');
              // Decode URI components to handle special characters
              params[decodeURIComponent(item[0])] = decodeURIComponent(item[1] || '');
          });

          return params;
      }

      async function getUserLocation() {

        
        if (navigator.geolocation) {
          
          await navigator.geolocation.getCurrentPosition((position) => {

            console.log(position);

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            if (lat && lng) {

              const geocoder = new google.maps.Geocoder();

              const pos = new google.maps.LatLng(lat, lng);

              geocoder.geocode({ location: pos }).then((response) => {
                if (response.results[0]) {
                  // map.setZoom(11);
                  const address = response.results[0].formatted_address;
                  $("#btn-add-to-route").data("address", address);
                  $("#modal-address").html(address);

                  // infowindow.setContent(address);
                  // infowindow.open(mMap, marker);
                  // INFO_MARKERS.set(label, infowindow);
                } else {
                  window.alert("No street address results found");
                }
              }).catch((e) => window.alert("Geocoder failed due to: " + e));

              //add postion to confirmation dialog and display
              $("#btn-add-to-route").data("position", pos);
              $('#routeControl').modal('show');

              //center the map
              map.panTo({ lat: lat, lng: lng});

              //update firestore user data
              updateLocation(position);              
            } 

          }, (error) => {
            window.alert("Failed to get location due to: " + error.message)
            console.log(error.message);
          });

        } //end geo location
      }

                  content: buildContent(driverData),

                  gmpClickable: true,

                });
                // bounds.extend(pos);
                marker.gmpClickable = true;
                marker.addListener("click", (event) => {
                  console.log(event);
                  $('#btn-request-now').data("driverId", change.doc.id);
                  $('#btn-request-now').data("token", change.doc.data().token);

                });



                DRIVER_MARKERS.set(driverId, marker);

                const bounds = map.getBounds().extend(pos);
                map.fitBounds(bounds);
              }

        
            }

            if (change.type === "modified") {
              console.log("Modified driver: ", change.doc.data());
              const marker = DRIVER_MARKERS.get(driverId);
              console.log(marker);
  
              if (change.doc.data().latitude && change.doc.data().longitude) {
                const pos = { lat: change.doc.data().latitude, lng: change.doc.data().longitude };
                marker.position = pos;
              }
              if (change.doc.data().updated != null) {
                const updatedDate = change.doc.data().updated;
                let titleText = "Driver is online";
                if (change.doc.data().name != null) {
                  titleText = change.doc.data().name + " is online at " + updatedDate.toDate();
                  marker.setTitle = titleText;
              }
            }
          }
            
            if (change.type === "removed") {
              console.log("Removed driver: ", change.doc.data());
              const marker = DRIVER_MARKERS.get(driverId);
              DRIVER_MARKERS.delete(driverId);
              marker.setMap(null);

          } else {
            $('#driver-alert').alert('close');
            buildPickupRoutes();

          }
        
        
        });

      function toggleHighlight(markerView, driver) {
          if (markerView.content.classList.contains("highlight")) {

      function buildContent(driver) {
          const content = document.createElement("div");
          content.classList.add("driver");
          const date = driver.updated.toDate();


          // Format for a specific locale (e.g., en-GB) with desired options
          const formattedDate = date.toLocaleString('en-GB', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
          });

          content.innerHTML = `
          <div class="icon">
              <i aria-hidden="true" class="fa fa-icon fa-${driver.type}" title="${driver.name}"></i>
              <span class="fa-sr-only">${driver.type}</span>
          </div>
          <div class="details">
              <div class="price">${driver.name}</div>
              <div class="address">${formattedDate}</div>
              <div class="features">
              <button class="btn btn-primary" id="btn-request" value="Request" onclick="sendRequest()">Request</button>
 


              </div>
          </div>
          `;
          return content;
      }

      async function buildPickupRoutes() {


        if(MARKERS.has("A") != true) {
          console.log("No pickup location yet");
          return;

        }

        const pickup = MARKERS.get("A");
        console.log(pickup);

        for (const driverMarker of DRIVER_MARKERS) {
          console.log(driverMarker[1]);

          const origin = driverMarker[1].position;
          const destination = pickup.position;

          // Define a computeRoutes request.
          const request = {
            origin: origin,
            destination: destination,
            travelMode: 'DRIVING',
            fields: ['path', 'description', 'distanceMeters', 'durationMillis'], // Request fields needed to draw polylines.
          };

          // Call the computeRoutes() method to get routes.
          const {routes} = await Route.computeRoutes(request);

          console.log(routes[0].toJSON());

          if (mapPolylines != null) {
            mapPolylines.forEach((polyline) => polyline.setMap(null));
          }
          // Call createPolylines to create polylines for the first route.
          mapPolylines = routes[0].createPolylines();
          // Add polylines to the map.
          mapPolylines.forEach((polyline) => polyline.setMap(map));
        
        }

      }
