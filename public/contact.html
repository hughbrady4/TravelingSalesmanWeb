<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Traveling Salesman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-card {
            max-width: 900px;
            margin: 2rem auto;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .chat-window {
            flex: 1;
            padding: 1rem;
            background: #f8fafc;
            border: 1px solid #d1d5db;
            border-radius: 1rem;
            overflow-y: auto;
        }
        .chat-message {
            display: inline-block;
            max-width: 80%;
            margin-bottom: 0.75rem;
            padding: 0.85rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .chat-message.sent {
            background: #0d6efd;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        .chat-message.received {
            background: #e9ecef;
            color: #212529;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        .chat-actions {
            padding-top: 1rem;
        }
        .message-text {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Traveling Salesman</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-fill">
        <div class="container">
            <div class="card chat-card shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="mb-4">
                        <h1 class="h3 mb-2">Contact Support</h1>
                        <p class="text-muted mb-0">Use this chat-style contact page to send a quick message to the Traveling Salesman team.</p>
                    </div>
                    <div id="chatMessages" class="chat-window d-flex flex-column"></div>
                    <form id="chatForm" class="chat-actions d-flex gap-2">
                        <textarea id="chatInput" class="form-control" rows="2" placeholder="Type your message here..."></textarea>
                        <button id="sendButton" type="submit" class="btn btn-primary">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="appToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <strong class="me-auto" id="toastTitle">Notification</strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toastBody">
          Message goes here
        </div>
      </div>
    </div>

    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Organic Systems LLC. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="contact.bundle.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
