        const newNode = document.createElement("li");
        newNode.textContent = address;

      async function routeRequest(data) {
          // Import the Routes library.
        const { Route } = await google.maps.importLibrary('routes');
        const iterator = MARKERS.entries();
        const array = iterator.toArray();
        const arrSize = array.length - 1;

        const origin = data.pickup;
        const destination = data.destination;

        console.log(origin);

        // Define a computeRoutes request.
        const request = {
          origin: origin,
          destination: destination,
          travelMode: 'DRIVING',
          fields: ['path', 'description', 'distanceMeters', 'durationMillis'], // Request fields needed to draw polylines.
        };

        // Call the computeRoutes() method to get routes.
        const {routes} = await Route.computeRoutes(request);

        console.log(routes[0].toJSON());

          // Call createPolylines to create polylines for the first route.
        const mapPolylines = routes[0].createPolylines();
        // Add polylines to the map.
        mapPolylines.forEach((polyline) => polyline.setMap(map));
    

        
      }

      function getAllNodes() {

        const nodeCollection = collection(firestore, "users");
        const q = query(nodeCollection, where("isOnline", "==", true));
        const unsubscribe = onSnapshot(q, (snapshot) => {
          // const bounds = mMap.getBounds();

          snapshot.docChanges().forEach((change) => {
            const nodeId = change.doc.id;
            const doc = change.doc;
            console.log(change.doc.data());

            if (change.type === "added") {

              if (doc.data().latitude && doc.data().longitude) {
                let position = { lat: doc.data().latitude, lng: doc.data().longitude };


                let marker = new AdvancedMarkerElement({
                  map: map,
                  gmpClickable: true,

                  gmpDraggable: false,
                  position: position,
                  title: nodeId,
                  // content: pinTextGlyph.element,
                });

                MARKERS.set(nodeId, marker);
            
              }

            }
            if (change.type === "modified") {

              if (doc.data().latitude && doc.data().longitude) {
                let position = { lat: doc.data().latitude, lng: doc.data().longitude };
                let marker = MARKERS.get(nodeId);
                marker.position = position;
              }

            }
            if (change.type === "removed") {

              let marker = MARKERS.get(nodeId);
              marker.setMap(null); 
              MARKERS.delete(nodeId);

              
            }
          });
        });
      }

      function getQueryParameters(url) {
          // Create a temporary anchor element to parse the URL
          var anchor = document.createElement('a');
          anchor.href = url;

          // Split the query string by '&' and then by '=' to get key-value pairs
          var params = {};
          anchor.search.slice(1).split('&').forEach(function(part) {
              var item = part.split('=');
              // Decode URI components to handle special characters
              params[decodeURIComponent(item[0])] = decodeURIComponent(item[1] || '');
          });

          return params;
      }

      async function getUserLocation() {

        if (navigator.geolocation) {
          
          await navigator.geolocation.getCurrentPosition((position) => {

            console.log(position);

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            if (lat && lng) {

              const geocoder = new google.maps.Geocoder();

              const pos = new google.maps.LatLng(lat, lng);

              geocoder.geocode({ location: pos }).then((response) => {
                if (response.results[0]) {
                  // map.setZoom(11);
                  const address = response.results[0].formatted_address;
                  $("#btn-add-to-route").data("address", address);
                  $("#modal-address").html(address);

                  // INFO_MARKERS.set(label, infowindow);
                } else {
                  window.alert("No street address results found");
                }
              }).catch((e) => window.alert("Geocoder failed due to: " + e));

              //add postion to confirmation dialog and display
              $("#btn-add-to-route").data("position", pos);
              $('#routeControl').modal('show');

              //center the map
              map.panTo({ lat: lat, lng: lng});

              //update firestore user data
              updateLocation(position);              
            } 

          }, (error) => {
            window.alert("Failed to get location due to: " + error.message)
            console.log(error.message);
          });

        } //end geo location
      }
