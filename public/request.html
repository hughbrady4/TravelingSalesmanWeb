<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride Request | Traveling Salesman</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 45%, #eef2ff 100%);
      min-height: 100vh;
    }

    .request-shell {
      max-width: 880px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    .request-card {
      border: 0;
      border-radius: 1rem;
      box-shadow: 0 24px 40px rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }

    .request-card .card-header {
      background: linear-gradient(135deg, #0f766e, #0891b2);
      color: #fff;
      padding: 1.25rem 1.5rem;
      border-bottom: 0;
    }

    .route-data {
      min-height: 120px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.75rem;
    }

    #place-autocomplete-widget gmp-place-autocomplete {
      width: 100%;
      display: block;
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GWDJ4TQSSY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-GWDJ4TQSSY');
  </script>

  <script>
    (g => {
      var h, a, k, p = 'The Google Maps JavaScript API', c = 'google', l = 'importLibrary', q = '__ib__', m = document, b = window;
      b = b[c] || (b[c] = {});
      var d = b.maps || (b.maps = {}), r = new Set(), e = new URLSearchParams(), u = () => h || (h = new Promise(async (f, n) => {
        await (a = m.createElement('script'));
        e.set('libraries', [...r] + '');
        for (k in g) {
          e.set(k.replace(/[A-Z]/g, t => '_' + t[0].toLowerCase()), g[k]);
        }
        e.set('callback', c + '.maps.' + q);
        a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
        d[q] = f;
        a.onerror = () => h = n(Error(p + ' could not load.'));
        a.nonce = m.querySelector('script[nonce]')?.nonce || '';

      key: 'AIzaSyBEE3PbSfTipC6WGZ3DMsGtWGU_LJVHYAc',
      v: 'weekly'
    });
  </script>

  <script type="module" src="request.bundle.js" defer></script>
</head>
<body>
  <main class="request-shell">
    <section class="card request-card">
      <header class="card-header">
        <h1 class="h4 mb-1">Ride Request</h1>
        <p class="mb-0 opacity-75">Choose your schedule and build your route stops.</p>
      </header>
      <div class="card-body p-4">
        <form id="ride-request-form" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="ride-datetime" class="form-label">Requested Date and Time</label>
              <input id="ride-datetime" name="rideDateTime" type="datetime-local" class="form-control" required>
              <div class="invalid-feedback">Please pick a date and time or choose the now option.</div>
            </div>
            <div class="col-md-6 d-flex align-items-end">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="ride-now" name="rideNow">
                <label class="form-check-label" for="ride-now">Request ride now</label>
              </div>
            </div>

            <div class="col-md-8">
              <label class="form-label">Add Stop with Google PlaceAutocomplete</label>
              <div id="place-autocomplete-widget"></div>
              <div class="form-text">Select from the Google suggestions to add it to the route list.</div>
            </div>
            <div class="col-md-4 d-flex align-items-end">
              <button id="btn-my-location" type="button" class="btn btn-outline-primary w-100">Add My Location</button>
            </div>

            <div class="col-12">
              <h2 class="h6 mb-2">Current Route</h2>
              <ul id="route-list" class="list-group"></ul>
            </div>

            <div class="col-12">
              <label for="route-data" class="form-label">Route Data Preview</label>
              <textarea id="route-data" class="form-control route-data" readonly aria-label="Route data preview"></textarea>
            </div>

            <div class="col-12 d-flex justify-content-between align-items-center mt-3">
              <a href="index.html" class="text-decoration-none">Back to home</a>
              <button type="submit" class="btn btn-primary px-4">Submit Request</button>
            </div>

            <div class="col-12">
              <div id="submit-summary" class="alert alert-success d-none mb-0" role="status"></div>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
