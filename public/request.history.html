    <style>
      .list-group-alpha {
        list-style: none; /* Remove default list styling */
        counter-reset: alpha-counter; /* Initialize a counter */
      }

      .list-group-alpha .list-group-item::before {
        counter-increment: alpha-counter; /* Increment the counter for each item */
        content: counter(alpha-counter, upper-alpha) ". "; /* Display the letter and a period */
        margin-right: 0.5rem; /* Add some spacing */
        font-weight: bold; /* Optional: make the letter bold */
      }

      #mapDiv {
        margin:auto;
        height: 500px;
      }

                  :root {
        --car-color: #FF9800;
        }


                  .driver {
        align-items: center;
        background-color: #FFFFFF;
        border-radius: 50%;
        color: #263238;
        display: flex;
        font-size: 14px;
        gap: 15px;
        height: 30px;
        justify-content: center;
        padding: 4px;
        position: relative;
        position: relative;
        transition: all 0.3s ease-out;
        width: 30px;
        transform: translateY(-9px);
      }


      .driver::after {
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-top: 9px solid #FFFFFF;
        content: "";
        height: 0;
        left: 50%;
        position: absolute;
        top: 95%;
        transform: translate(-50%, 0);
        transition: all 0.3s ease-out;
        width: 0;
        z-index: 1;
      }

            .driver .icon {
        align-items: center;
        display: flex;
        justify-content: center;
        color: #FFFFFF;
      }

            .driver .details {
        display: none;
        flex-direction: column;
        flex: 1;
      }

            .driver .updated {
        color: #9E9E9E;
        font-size: 10px;
        margin-bottom: 10px;
        margin-top: 5px;
      }

            .driver.highlight {
        background-color: #FFFFFF;
        border-radius: 8px;
        box-shadow: 10px 10px 5px rgba(0, 0, 0, 0.2);
        height: 80px;
        padding: 8px 15px;
        width: auto;
      }


      .driver.highlight::after {
        border-top: 9px solid #FFFFFF;
      }

      .driver.highlight .details {
        display: flex;
      }

      .driver.highlight .icon svg {
        width: 50px;
        height: 50px;
      }

            /*
      * Car icon colors.
      */
      .driver.highlight:has(.fa-car) .icon {
        color: var(--car-color);
      }

      .driver:not(.highlight):has(.fa-car) {
        background-color: var(--car-color);
      }

      .driver:not(.highlight):has(.fa-car)::after {
        border-top: 9px solid var(--car-color);
      }

    </style>
