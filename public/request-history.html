<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request History | Traveling Salesman</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      background: linear-gradient(160deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
    }

    .history-shell {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .history-card {
      border: 0;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
    }

    .history-header {
      background: linear-gradient(120deg, #0f766e 0%, #0369a1 100%);
      color: #fff;
    }
  </style>
  <script defer src="history.bundle.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid justify-content-between">
      <a class="navbar-brand" href="index.html" id="heading">Traveling Salesman</a>
      <div class="d-flex gap-2">
      </div>
    </div>
  </nav>

  <main class="history-shell">
    <section class="card history-card">
      <header class="card-header history-header py-3 px-4 d-flex justify-content-between align-items-center">
        <div>
          <h1 class="h4 mb-1">Ride Request History</h1>
          <p class="mb-0 opacity-75">Review your submitted requests and track statuses.</p>
        </div>
      </header>

      <div class="card-body p-4">
        <div id="loading-state" class="alert alert-info" role="status">Loading your ride requests...</div>
        <div id="empty-state" class="alert alert-secondary d-none" role="status"></div>
        <div id="error-state" class="alert alert-danger d-none" role="alert"></div>
        <ol class="list-group" id="req-node-list"></ol>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
