</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Traveling Salesman</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="onboard.html">Onboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="profile.html" id="profileNavLink">Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h3 mb-3">User Profile</h1>
            <p class="text-muted mb-4">This page displays information from the current Firebase auth user and the Firestore <code>users</code> collection.</p>
            <div id="loadingStatus" class="alert alert-info">Loading profile information...</div>
            <div id="signedOutState" class="alert alert-warning" style="display: none;">
              <p class="mb-2">You are not signed in.</p>
              <a href="auth.html" class="btn btn-primary">Sign In</a>
            </div>
            <div id="signedInState" style="display: none;">
              <div id="userInfo" class="mb-4"></div>
              <div id="firestoreUserInfo" class="mb-4"></div>
              <button id="signOutBtn" class="btn btn-outline-secondary">Sign Out</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-3 mt-5">
    <div class="container text-center">
