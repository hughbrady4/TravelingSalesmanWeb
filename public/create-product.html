<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Stripe Product | Traveling Salesman</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Traveling Salesman - Create Product</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="onboard.html">Onboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="profile.html">Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="merchant-details.html">Merchant Details</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <p class="text-body-secondary mb-4">Create a product and price under your connected Stripe account.</p>

            <div id="productStatus" class="alert alert-info mb-4">Loading account details...</div>

            <form id="createProductForm" novalidate>
              <div class="mb-3">
                <label for="accountId" class="form-label">Stripe Account</label>
                <select id="accountId" class="form-select" required>
                  <option value="" selected disabled>Loading accounts...</option>
                </select>
                <div id="selectedCompanyName" class="form-text">Selected company: N/A</div>
              </div>

              <div class="mb-3">
                <label for="productName" class="form-label">Product Name</label>
                <input type="text" id="productName" class="form-control" required maxlength="120" placeholder="Example: Premium Cleaning Service">
              </div>

              <div class="mb-3">
                <label for="productDescription" class="form-label">Description</label>
                <textarea id="productDescription" class="form-control" rows="4" required maxlength="1000" placeholder="Describe the product or service."></textarea>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-sm-6">
                  <label for="productPrice" class="form-label">Price (USD)</label>
                  <input type="number" id="productPrice" class="form-control" required min="0.50" step="0.01" placeholder="29.99">
                  <div class="form-text">Price is entered in dollars.</div>
                </div>
                <div class="col-sm-6">
                  <label for="productCurrency" class="form-label">Currency</label>
                  <input type="text" id="productCurrency" class="form-control" value="usd" maxlength="3">
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-sm-6 d-flex align-items-center">
                  <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="isRecurring">
                    <label class="form-check-label" for="isRecurring">
                      Charge recurring
                    </label>
                  </div>
                </div>
                <div class="col-sm-6">
                  <label for="recurringInterval" class="form-label">Recurring Interval</label>
                  <select id="recurringInterval" class="form-select" disabled>
                    <option value="day">Daily</option>
                    <option value="week">Weekly</option>
                    <option value="month" selected>Monthly</option>
                    <option value="year">Yearly</option>
                  </select>
                </div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" id="submitBtn" class="btn btn-primary">Create Product</button>
                <a href="merchant-details.html" class="btn btn-outline-primary">Merchant Details</a>
                <a href="onboard.html" class="btn btn-outline-secondary">Back to Onboard</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script defer src="createproduct.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
