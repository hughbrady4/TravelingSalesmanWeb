<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Details | Traveling Salesman</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      background: linear-gradient(145deg, #f8fafc 0%, #e0f2fe 100%);
      min-height: 100vh;
    }

    .details-shell {
      max-width: 980px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }

    .details-card {
      border: 0;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(2, 6, 23, 0.1);
    }

    .details-header {
      background: linear-gradient(135deg, #0f766e 0%, #0369a1 100%);
      color: #fff;
    }

    .raw-json {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 0.75rem;
      padding: 1rem;
      font-size: 0.8rem;
      min-height: 180px;
      overflow-x: auto;
    }

    .status-pill {
      display: inline-block;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: #d1fae5;
      color: #065f46;
      font-weight: 600;
      text-transform: capitalize;
    }
  </style>
  <script type="module" src="requestdetails.bundle.js" defer></script>
</head>
<body>
  <main class="details-shell">
    <section class="card details-card">
      <header class="card-header details-header py-3 px-4 d-flex justify-content-between align-items-center">
        <div>
          <h1 class="h4 mb-1">Request Details</h1>
          <p class="mb-0 opacity-75">Full ride request information</p>
        </div>
        <a href="request.html" class="btn btn-light btn-sm">New Request</a>
      </header>

      <div class="card-body p-4">
        <div id="loading-state" class="alert alert-info mb-4">Loading request details...</div>
        <div id="error-state" class="alert alert-danger d-none mb-4" role="alert"></div>

        <div id="detail-state" class="d-none">
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <div class="border rounded p-3 h-100 bg-light-subtle">
                <div class="text-secondary small">Request ID</div>
                <div id="request-id" class="fw-semibold"></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border rounded p-3 h-100 bg-light-subtle">
                <div class="text-secondary small">Status</div>
                <div class="mt-1"><span id="request-status" class="status-pill"></span></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border rounded p-3 h-100 bg-light-subtle">
                <div class="text-secondary small">User UID</div>
                <div id="request-user" class="fw-semibold"></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border rounded p-3 h-100 bg-light-subtle">
                <div class="text-secondary small">Schedule</div>
                <div id="request-schedule" class="fw-semibold"></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border rounded p-3 h-100 bg-light-subtle">
                <div class="text-secondary small">Distance</div>
                <div id="request-distance" class="fw-semibold"></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border rounded p-3 h-100 bg-light-subtle">
                <div class="text-secondary small">Duration</div>
                <div id="request-duration" class="fw-semibold"></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border rounded p-3 h-100 bg-light-subtle">
                <div class="text-secondary small">Pickup Address</div>
                <div id="request-pickup" class="fw-semibold"></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border rounded p-3 h-100 bg-light-subtle">
                <div class="text-secondary small">Dropoff Address</div>
                <div id="request-dropoff" class="fw-semibold"></div>
              </div>
            </div>
          </div>

          <div id="payment-url-container" class="alert alert-success d-none" role="status">
            <strong>Payment URL:</strong>
            <a id="payment-url" href="#" target="_blank" rel="noopener noreferrer" class="ms-2"></a>
          </div>

          <section class="mb-4">
            <h2 class="h6">Route Stops</h2>
            <div class="table-responsive">
              <table class="table table-sm table-striped align-middle mb-0">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Label</th>
                    <th>Address</th>
                    <th>Coordinates</th>
                  </tr>
                </thead>
                <tbody id="route-stops-table"></tbody>
              </table>
            </div>
          </section>

          <section>
            <h2 class="h6">Raw Request Data</h2>
            <pre id="raw-request" class="raw-json mb-0"></pre>
          </section>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
